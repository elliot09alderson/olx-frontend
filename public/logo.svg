<svg width="140" height="40" viewBox="0 0 140 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Modern circular logo background -->
  <circle cx="20" cy="20" r="18" fill="url(#logoGradient)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- OLX text inside circle with better typography -->
  <text x="20" y="26" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="12" fill="white" text-anchor="middle" letter-spacing="-0.5px">OLX</text>
  
  <!-- Brand text outside -->
  <text x="48" y="18" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="18" fill="#0d9488" letter-spacing="-0.5px">OLX</text>
  <text x="48" y="30" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="11" fill="#2dd4bf" letter-spacing="0.5px">MARKETPLACE</text>
</svg>